replicaCount: 1

image:
  repository: ghcr.io/redpeppersnest/powderandcanvas
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-creds
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# The image is nginx-unprivileged, which runs as uid/gid 101.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: NodePort
  port: 8080

resources:
    limits:
        cpu: 200m
        memory: 128Mi
    requests:
        cpu: 50m
        memory: 64Mi

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
