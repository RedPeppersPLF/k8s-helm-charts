apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-secret-store
  annotations:
    external-secrets.io/disable-maintenance-checks: "true"
spec:
  retrySettings:
    maxRetries: 4
    retryInterval: "15s"

  provider:
    vault:
      server: "https://10.1.63.20:8200"
      path: "secret"
      version: "v2"
      caBundle: ""

      auth:
        jwt:
          path: "k8s-jwt"
          role: "eso"
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: "external-secrets"
              namespace: "vault"
              audiences: ["vault"]
